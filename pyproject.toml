[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keqing-workbench"
version = "0.1.0"
description = "Control-plane application for the Mortal-based riichi mahjong stack: gateway, replay, participants, UI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.2",
  "mahjong>=1.4.0",
  "numpy>=1.24",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "riichienv==0.4.8",
  "setuptools==70.2.0; sys_platform == 'win32' and python_version == '3.12'",
  "torch==2.12.0+cu130; sys_platform == 'win32' and python_version == '3.12'",
  "torch>=2.11.0; sys_platform != 'win32' or python_version != '3.12'",
  "uvicorn>=0.42.0",
  "websockets==17.0.1",
]

# keqing_core is installed as the runtime wheel built by keqing-mortal
# (see scripts/setup-dev.ps1); it is intentionally not a source dependency.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["workbench", "src", "."]
testpaths = ["tests"]
python_files = [
    "test_*.py",
]
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.10",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32' and python_version == '3.12'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
