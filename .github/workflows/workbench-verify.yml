name: Workbench verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python:
    name: Python default tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Install keqing_core runtime wheel
        env:
          KEQING_CORE_WHEEL_URL: ${{ secrets.KEQING_CORE_WHEEL_URL }}
        run: |
          if [ -z "${KEQING_CORE_WHEEL_URL:-}" ]; then
            echo "::error::KEQING_CORE_WHEEL_URL secret is missing or empty"
            exit 1
          fi
          uv pip install --python .venv/bin/python "$KEQING_CORE_WHEEL_URL"
          .venv/bin/python -c "import keqing_core; print('keqing_core loaded from:', keqing_core.__file__)"

      - name: Run default pytest suite
        run: .venv/bin/python -m pytest -q

  replay-ui:
    name: Replay UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench/replay_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workbench/replay_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Semantic checks
        run: |
          npm run check:participant-semantics
          npm run check:ladder-live-semantics
          npm run check:ladder-season-semantics
          npm run check:ladder-ingest-semantics
          npm run check:review-daiminkan
          npm run check:review-e2e
          npm run check:season-manager-semantics

      - name: Build
        run: npm run build
